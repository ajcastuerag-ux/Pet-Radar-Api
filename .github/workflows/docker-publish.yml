# Multi Stage Build
name: Build & Push Docker Image
on:
  push:
    branches:
      - main
 
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        name: Clonar repositorio
      
      - name: Construir imagen
        run: docker build -t astridjc/pet-radar-api:latest .
 
      - name: Retaggear imagen con commit
        run: docker tag astridjc/pet-radar-api:latest astridjc/pet-radar-api:${{ github.sha }}
# Secretos y variables !!!!!!! por ambiente
      - name: Docker login
        run: docker login -u ${{ secrets.DOCKER_USER }} -p ${{ secrets.DOCKER_PASSWORD }}
 
      - name: Docker Push
        run: |
          docker push astridjc/pet-radar-api:latest
          docker push astridjc/pet-radar-api:${{ github.sha }}

          